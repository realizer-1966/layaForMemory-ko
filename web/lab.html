<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya Memory 측정실</title>
<script src="./coi.js"></script>
</head>
<body>
<p>측정·녹음용 페이지입니다. <code>scripts/drive.py</code> 또는 브라우저 콘솔의 <code>window.__lab</code>에서 구동합니다. 상태: <span id="st">대기</span></p>
<script type="module">
import { loadLaya } from "./model.js";
import { loadEmbedder } from "./embedder.js";
import { encodeVec, compactAnswers } from "./common.js";
import { QUESTIONS, DEFAULT_POLICY, cosine, eventState, pairState, eventCacheKey, pairCacheKey, EVENT_KEY, PAIR_KEY } from "./governor-core.js";
const st = (s) => (document.getElementById("st").textContent = s);
const lab = window.__lab = { laya: null, emb: null, info: null, done: 0 };

lab.load = async (variant = "q4e8", backend = "auto", embed = false) => {
  const r = await loadLaya({ variant, backend, onStatus: st });
  lab.laya = r.laya; lab.info = { backend: r.backend, ...r.info };
  if (embed) lab.emb = await loadEmbedder({ onStatus: st });
  st("준비됨"); return lab.info;
};

/** 실험: 임의의 사건/쌍 질문 사전. 질문별 noul 확률 또는 choice 확률을 돌려준다. */
lab.probe = async (cases, eventQs, pairQs) => {
  const flat = (ans) => Object.fromEntries(Object.entries(ans).map(([k, a]) => [k, a.type === "noul" ? a.noul : a.probabilities]));
  const ev = new Map(), out = []; lab.done = 0;
  for (const c of cases) {
    if (!ev.has(c.event)) ev.set(c.event, flat((await lab.laya.systemOne({ event: c.event, source: c.evSource }, eventQs)).answers));
    const p = flat((await lab.laya.systemOne({ memory: c.memory, memory_source: c.memSource, event: c.event, event_source: c.evSource }, pairQs)).answers);
    out.push({ id: c.id, expected: c.expected, ev: ev.get(c.event), pair: p });
    lab.done++; st(`${lab.done}/${cases.length}`);
  }
  return out;
};

/**
 * recorded.json용 재생 데이터. 세 세계(평가 사례, 놀이터, 앱)마다: 모든 사건 텍스트, 사건이 들어올 때 존재할 수 있는
 * 모든 기억 텍스트(시드 + 후속 기억으로 저장된 사건 텍스트), 그리고 검사 대상이 될 만큼 비슷한 모든 (기억, 사건) 쌍.
 * 모든 텍스트와 질의의 벡터도 담는다. `prev`(현재 recorded.json, 같은 질문 지문)에 있는 답변은 재사용한다.
 */
lab.record = async (prev = {}, scope = "all") => {
  const say = (s) => { st(s); };
  const sc = await (await fetch("./scenarios.json")).json();
  const cases = (await (await fetch("./cases.json")).json()).cases;
  const fill = (t, o) => t.replace(/\{(\w+)\}/g, (_, k) => o[k]);
  const pairs = [], events = new Map(), texts = new Set();
  const addEv = (e) => { events.set(eventCacheKey(e), e); texts.add(e.text); };
  // 평가: 라벨이 붙은 쌍 그대로
  if (scope === "all" || scope === "eval") for (const c of cases) { addEv({ text: c.event, source: c.evSource }); pairs.push([{ text: c.memory, source: c.memSource }, { text: c.event, source: c.evSource }, true]); texts.add(c.memory); }
  // 세계: 모든 사건 x 가능한 모든 기억, 아래에서 유사도로 거른다
  const worlds = [];
  if (scope === "all" || scope === "playground") {
    const p = sc.playground;
    const evs = p.events.map((e) => ({ text: e.text, source: e.source }));
    worlds.push({ mems: [...p.memories.map((m) => ({ text: m.text, source: m.source })), ...evs], evs, queries: p.queries });
  }
  if (scope === "all" || scope === "app") {
    const a = sc.app, evs = [];
    for (const f of a.fields) for (const o of f.options) for (const n of f.options) if (o !== n) evs.push({ text: fill(f.event, { old: o, new: n }), source: "설정" });
    for (const m of a.messages) evs.push({ text: m.text, source: m.source });
    const seeds = [...a.fields.map((f) => ({ text: fill(f.memory, { v: f.initial }), source: "프로필" })), ...a.seedMemories.map((m) => ({ text: m.text, source: m.source }))];
    worlds.push({ mems: [...seeds, ...evs], evs, queries: a.queries });
  }
  for (const w of worlds) { w.mems.forEach((m) => texts.add(m.text)); w.evs.forEach(addEv); w.queries.forEach((q) => texts.add(q)); }
  say("임베딩 " + texts.size);
  const list = [...texts], vecs = await lab.emb.embed(list);
  const V = new Map(list.map((t, i) => [t, vecs[i]]));
  // 런타임과 같은 후보 규칙: 사건마다 유사도 상위 topK개만(전체 조합은 700쌍이 넘어 녹음이 너무 길다).
  for (const w of worlds) for (const e of w.evs) {
    const cand = w.mems
      .filter((m) => m.text !== e.text)
      .map((m) => ({ m, sim: cosine(V.get(m.text), V.get(e.text)) }))
      .filter((x) => x.sim >= DEFAULT_POLICY.minSim)
      .sort((a, b) => b.sim - a.sim)
      .slice(0, DEFAULT_POLICY.topK);
    for (const c of cand) pairs.push([c.m, e, false]);
  }
  const answers = {}; let i = 0; const t0 = performance.now();
  let since = 0;
  const save = async () => {
    try { localStorage.setItem("lm.rec", JSON.stringify(answers)); } catch {}
    try { await fetch("http://127.0.0.1:8770/", { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ answers }) }); } catch {}
  };
  const evList = [...events.values()];
  for (const e of evList) { const k = eventCacheKey(e); answers[k] = prev[k] || compactAnswers((await lab.laya.systemOne(eventState(e), QUESTIONS.event)).answers); say(`사건 ${++i}/${evList.length}`); if (++since % 5 === 0) await save(); }
  i = 0;
  for (const [m, e] of pairs) {
    const k = pairCacheKey(m, e);
    if (!answers[k]) answers[k] = prev[k] || compactAnswers((await lab.laya.systemOne(pairState(m, e), QUESTIONS.pair)).answers);
    say(`쌍 ${++i}/${pairs.length}`); if (++since % 5 === 0) await save();
  }
  await save();
  return {
    version: 1,
    note: "Laya 답변과 다국어 MiniLM 벡터를 녹음한 파일. 키는 질문 지문 | 출처 | 텍스트.",
    model: { variant: lab.info.variant, backend: lab.info.backend, source: lab.info.source, recordedAt: new Date().toISOString(), seconds: Math.round((performance.now() - t0) / 1000), eventKey: EVENT_KEY, pairKey: PAIR_KEY },
    vectors: Object.fromEntries(list.map((t) => [t, encodeVec(V.get(t))])),
    answers,
  };
};
st("로드됨");
</script>
</body>
</html>
